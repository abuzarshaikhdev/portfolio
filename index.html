<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abuzar Shaikh | Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Abuzar.</div>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#certificates">Certificates</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
    <header id="about" class="hero-section">
      <div class="profile-header">
        <img src="assets/profile.png" alt="Abuzar Shaikh" class="profile-img" />
        <h1 class="profile-greeting">Hi, I'm Abuzar.</h1>
      </div>
      <p class="subtitle">
        A learner of Computer Science & Engineering specializing in AI & ML
      </p>
    </header>
    <main id="certificates" class="certificates-section">
      <h2>My Earned Certificates</h2>
      <div class="certificates-grid">
        <div class="cert-card">
          <div class="cert-img-wrapper">
            <img
              src="assets/certificate1.png"
              alt="Certificate 1"
              onerror="this.src = 'https://placehold.co'"
            />
          </div>
          <div class="cert-info">
            <h3></h3>
            <p></p>
          </div>
        </div>
        <div class="cert-card">
          <div class="cert-img-wrapper">
            <img
              src="assets/certificate2.png"
              alt="Certificate 2"
              onerror="this.src = 'https://placehold.co'"
            />
          </div>
          <div class="cert-info">
            <h3></h3>
            <p></p>
          </div>
        </div>
        <div class="cert-card">
          <div class="cert-img-wrapper">
            <img
              src="assets/certificate3.png"
              alt="Certificate 3"
              onerror="this.src = 'https://placehold.co'"
            />
          </div>
          <div class="cert-info">
            <h3></h3>
            <p></p>
          </div>
        </div>
      </div>
    </main>
    <footer id="contact" class="footer">
      <p>Connect with me</p>
      <div class="social-links">
        <a href="#" target="_blank">LinkedIn</a>
        <a href="https://github.com" target="_blank">GitHub</a>
      </div>
      <p class="copyright">&copy; 2026 Abuzar Shaikh. All rights reserved.</p>
    </footer>
  </body>
</html>
